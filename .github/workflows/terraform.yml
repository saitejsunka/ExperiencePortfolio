name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Fix Corrupted State (Temporary)
        run: |
          terraform state rm module.infrastructure_components.google_sql_user.users || true
          terraform state rm module.infrastructure_components.google_sql_database.database || true

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
