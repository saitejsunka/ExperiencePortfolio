syntax = "proto3";

package saitejsunka.expo.backend.v1;

option go_package = "github.com/saitejsunka/ExperiencePortfolio/Portfolio/backend/stubs";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// The ExpoBackendService manages posts in the portfolio application.
service ExpoBackendService {
  // CreatePost performs an UPSERT operation.
  // If post_id is provided and exists, it updates the existing post.
  // If post_id is empty, it creates a new post.
  rpc CreatePost(CreatePostRequest) returns (Post);

  // ReadPost retrieves a post by its ID.
  rpc ReadPost(ReadPostRequest) returns (Post);

  // DeletePost performs a delete operation (typically a soft delete based on schema).
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
}

// Represents a Post entity, directly mapped from the database schema.
message Post {
  string post_id = 1;            // UUID
  string author_id = 2;          // UUID
  string content = 3;            // TEXT
  repeated string media_urls = 4; // TEXT[]
  int32 like_count = 5;          // INT
  int32 reply_count = 6;         // INT
  int32 repost_count = 7;        // INT
  string parent_post_id = 8;     // UUID (Optional)
  bool is_deleted = 9;           // BOOLEAN
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreatePostRequest {
  // Optional. If provided, the operation will attempt to update the existing post.
  // If omitted, a new post_id will be generated by the database.
  string post_id = 1;
  
  // Required for creation.
  string author_id = 2;
  
  string content = 3;
  repeated string media_urls = 4;
  
  // Optional. Set if this post is a reply to another post.
  string parent_post_id = 5;
}

message ReadPostRequest {
  string post_id = 1;
}

message DeletePostRequest {
  string post_id = 1;
}
